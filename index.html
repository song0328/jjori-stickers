<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쪼리 움직이는 짤 6종</title>
<meta property="og:title" content="쪼리 움직이는 짤 6종">
<meta property="og:description" content="눌러서 저장해 가세요.">
<meta property="og:image" content="https://song0328.github.io/jjori-stickers/icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#fff5ec;--card:#ffffff;--ink:#613523;--soft:#a67c68;--peach:#f29a6b;--peach-ink:#ffffff;--line:#f3dccb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-weight:400;font-size:1.9rem;margin:0 0 6px}
.lede{margin:0 0 22px;color:var(--soft);font-size:1.05rem;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
figure img{width:100%;aspect-ratio:1;display:block;background:#fff}
a.save{display:block;margin:10px;padding:12px 8px;border-radius:12px;background:var(--peach);color:var(--peach-ink);text-align:center;text-decoration:none;font-size:1.05rem}
a.save:active{filter:brightness(.92)}
a.save:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.help{margin-top:26px;padding:16px;border-radius:14px;border:1px dashed var(--line);color:var(--soft);line-height:1.6;font-size:.98rem}
.help b{color:var(--ink);font-weight:400}
footer{margin-top:22px;color:var(--soft);font-size:.92rem}
footer a{color:var(--ink)}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
  <h1>쪼리 움직이는 짤 6종</h1>
  <p class="lede">마음에 드는 짤의 저장 버튼을 눌러 가져가세요.</p>
  <div class="grid">
    <figure><img src="jjori-hello.gif" alt="안녕! 하고 인사하는 쪼리"><a class="save" href="jjori-hello.gif" download="jjori-hello.gif">안녕! 저장</a></figure>
    <figure><img src="jjori-thanks.gif" alt="고마워 하고 고개 숙이는 쪼리"><a class="save" href="jjori-thanks.gif" download="jjori-thanks.gif">고마워 저장</a></figure>
    <figure><img src="jjori-love.gif" alt="좋아 하고 하트를 안는 쪼리"><a class="save" href="jjori-love.gif" download="jjori-love.gif">좋아 저장</a></figure>
    <figure><img src="jjori-sleepy.gif" alt="졸려... 하고 눕는 쪼리"><a class="save" href="jjori-sleepy.gif" download="jjori-sleepy.gif">졸려... 저장</a></figure>
    <figure><img src="jjori-sorry.gif" alt="미안... 하고 시무룩한 쪼리"><a class="save" href="jjori-sorry.gif" download="jjori-sorry.gif">미안... 저장</a></figure>
    <figure><img src="jjori-rest.gif" alt="잠깐만! 하고 놀라는 쪼리"><a class="save" href="jjori-rest.gif" download="jjori-rest.gif">잠깐만! 저장</a></figure>
  </div>
  <p class="help"><b>저장이 안 되나요?</b><br>짤을 꾹 눌러 “이미지 저장”을 고르거나, 오른쪽 위 메뉴에서 “브라우저에서 열기”를 누른 뒤 다시 저장해 보세요.</p>
  <footer>만든 곳 <a href="https://www.instagram.com/hi_jjori/">@hi_jjori</a></footer>
</main>
</body>
</html>
